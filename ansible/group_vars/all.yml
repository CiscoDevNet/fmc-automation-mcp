fmc_hostname: "{{ lookup('env', 'FMC_HOST') | default('https://fmc.example.local', true) }}"
fmc_username: "{{ lookup('env', 'FMC_USERNAME') | default('apiuser', true) }}"
fmc_password: "{{ lookup('env', 'FMC_PASSWORD') }}"

# TLS certificate validation is ON by default. Override to false only against a lab
# FMC that presents a self-signed certificate.
fmc_verify_ssl: "{{ lookup('env', 'VERIFY_SSL') | default(true, true) | bool }}"

# Leave empty to discover it with the get_domain playbook.
domain_uuid: "{{ lookup('env', 'FMC_DOMAIN_UUID') | default('', true) }}"
